name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r apps/api/requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - shell: bash
        run: find apps/web -name "*.js" -print0 | xargs -0 -n1 node --check
      - run: python -m compileall -q apps/api crawler_engine tests
